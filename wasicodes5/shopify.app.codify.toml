client_id = "5783d13dc4cf0aad0ce08321e3639bed"
application_url = "https://codify-app-live.vercel.app"
embedded = true
name = "codify"
handle = "codify-cod-automation"

[access_scopes]
scopes = "read_customers,read_draft_orders,read_orders,write_customers,write_draft_orders,write_metaobject_definitions,write_metaobjects,write_orders,write_products"

[auth]
redirect_urls = [ "https://codify-app-live.vercel.app/api/auth/callback" ]

[app_proxy]
url = "https://codify-app-live.vercel.app/apps/codify-checkout"
